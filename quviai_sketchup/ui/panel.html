<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUVIAI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;font-size:13px;background:#1e1e1e;color:#ddd;padding:12px}
  h2{font-size:15px;color:#fff;margin-bottom:12px}
  label{display:block;margin-bottom:2px;color:#aaa;font-size:11px}
  input,select,textarea{width:100%;padding:6px 8px;background:#2d2d2d;border:1px solid #444;
    border-radius:4px;color:#eee;font-size:13px;margin-bottom:8px}
  textarea{resize:vertical;min-height:60px}
  button{width:100%;padding:8px;border:none;border-radius:4px;cursor:pointer;
    font-size:13px;margin-bottom:6px}
  .btn-primary{background:#4f7bff;color:#fff}
  .btn-primary:hover{background:#3a64e0}
  .btn-secondary{background:#333;color:#ccc}
  .btn-secondary:hover{background:#444}
  .btn-danger{background:#c0392b;color:#fff}
  .status-box{background:#2d2d2d;border-radius:4px;padding:8px;margin-top:8px;font-size:12px;color:#aaa}
  .progress{height:6px;background:#444;border-radius:3px;overflow:hidden;margin-bottom:6px}
  .progress-bar{height:100%;background:#4f7bff;transition:width .3s}
  .error{color:#e74c3c}
  .success{color:#2ecc71}
  .credits{font-size:11px;color:#aaa;margin-bottom:10px}
  .section{margin-top:14px;border-top:1px solid #333;padding-top:10px}
  .row{display:flex;gap:6px}
  .row>*{flex:1}
  #login-view,#main-view{display:none}
</style>
</head>
<body>

<!-- Login -->
<div id="login-view">
  <h2>QUVIAI</h2>
  <label>E-mail</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <button class="btn-primary" onclick="login()">Log In</button>
  <div id="login-status"></div>
</div>

<!-- Main -->
<div id="main-view">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0">QUVIAI</h2>
    <button class="btn-secondary" style="width:auto;padding:4px 10px" onclick="logout()">Log Out</button>
  </div>
  <div class="credits">Credits: <span id="credits-val">—</span>
    <a href="#" onclick="refreshCredits();return false" style="color:#4f7bff;margin-left:6px">↻</a>
  </div>

  <!-- Render 3D -->
  <div>
    <label>Category</label>
    <select id="style-category" onchange="onCategoryChange()">
      <option value="architectural">Architectural</option>
      <option value="general">General</option>
    </select>

    <label>Style</label>
    <select id="style-select"></select>

    <label>Prompt</label>
    <textarea id="prompt" placeholder="Describe the scene…" rows="3"></textarea>

    <div id="arch-controls">
      <label>Render Type</label>
      <select id="render-type" onchange="onRenderTypeChange()">
        <option value="exterior">Exterior</option>
        <option value="interior">Interior</option>
        <option value="site">Site</option>
      </select>

      <div id="ext-controls" class="row">
        <div>
          <label>Time</label>
          <select id="day-time">
            <option value="day">Day</option>
            <option value="night">Night</option>
          </select>
        </div>
        <div>
          <label>Weather</label>
          <select id="weather">
            <option value="sunny">Sunny</option>
            <option value="cloudy">Cloudy</option>
            <option value="rainy">Rainy</option>
            <option value="snowy">Snowy</option>
            <option value="windy">Windy</option>
            <option value="foggy">Foggy</option>
          </select>
        </div>
      </div>
    </div>

    <label style="margin-top:4px">
      <input type="checkbox" id="use-viewport" checked> Use current viewport as reference
    </label>
    <div id="custom-image-row" style="display:none;margin-top:4px">
      <label>Image path</label>
      <input type="text" id="image-path" placeholder="/path/to/image.jpg">
    </div>

    <button class="btn-primary" style="margin-top:10px" onclick="startRender()" id="render-btn">Render</button>

    <div id="render-status" class="status-box" style="display:none">
      <div class="progress"><div class="progress-bar" id="render-progress-bar" style="width:0%"></div></div>
      <span id="render-status-text">Submitting…</span>
    </div>
  </div>

  <!-- 3D Object -->
  <div class="section">
    <h2 style="font-size:13px;margin-bottom:8px">3D Object Generation</h2>

    <div class="row" style="margin-bottom:8px">
      <button id="obj-mode-prompt" class="btn-primary" onclick="setObjMode('prompt')">From Prompt</button>
      <button id="obj-mode-image" class="btn-secondary" onclick="setObjMode('image')">From Image</button>
    </div>

    <div id="obj-prompt-area">
      <label>Prompt</label>
      <textarea id="obj-prompt" placeholder="A modern chair…" rows="2"></textarea>
    </div>
    <div id="obj-image-area" style="display:none">
      <label>Image path</label>
      <input type="text" id="obj-image-path" placeholder="/path/to/image.jpg">
    </div>

    <button class="btn-primary" onclick="startObject()" id="obj-btn">Generate 3D Object</button>

    <div id="obj-status" class="status-box" style="display:none">
      <div class="progress"><div class="progress-bar" id="obj-progress-bar" style="width:0%"></div></div>
      <span id="obj-status-text">Submitting…</span>
    </div>
  </div>
</div>

<script>
const ARCH_STYLES = [
  ["no style","No Style"],["modern","Modern"],["contemporary","Contemporary"],
  ["minimalist","Minimalist"],["art_deco","Art Deco"],["industrial","Industrial"],
  ["scandinavian","Scandinavian"],["mediterranean","Mediterranean"],["victorian","Victorian"],
  ["baroque","Baroque"],["gothic","Gothic"],["neoclassical","Neoclassical"],
  ["brutalist","Brutalist"],["futuristic","Futuristic"],["organic","Organic"],
  ["biophilic","Biophilic"],["zen","Zen"],["tropical","Tropical"],
  ["rustic","Rustic"],["colonial","Colonial"]
];
const GENERAL_STYLES = [
  ["no style","No Style"],["realistic","Realistic"],["photorealistic","Photorealistic"],
  ["concept_art","Concept Art"],["illustration","Illustration"],["anime","Anime"],
  ["cartoon","Cartoon"],["watercolor","Watercolor"],["oil_painting","Oil Painting"],
  ["sketch","Sketch"],["3d_render","3D Render"],["cinematic","Cinematic"]
];

let objMode = "prompt";
let lastRenderPath = null;

function onCategoryChange(){
  const cat = document.getElementById("style-category").value;
  populateStyles(cat === "architectural" ? ARCH_STYLES : GENERAL_STYLES);
  document.getElementById("arch-controls").style.display = cat === "architectural" ? "" : "none";
}

function populateStyles(list){
  const sel = document.getElementById("style-select");
  sel.innerHTML = list.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
}

function onRenderTypeChange(){
  const rt = document.getElementById("render-type").value;
  document.getElementById("ext-controls").style.display = rt === "exterior" ? "" : "none";
}

document.getElementById("use-viewport").addEventListener("change", function(){
  document.getElementById("custom-image-row").style.display = this.checked ? "none" : "";
});

function setObjMode(mode){
  objMode = mode;
  document.getElementById("obj-prompt-area").style.display = mode === "prompt" ? "" : "none";
  document.getElementById("obj-image-area").style.display  = mode === "image"  ? "" : "none";
  document.getElementById("obj-mode-prompt").className = mode === "prompt" ? "btn-primary" : "btn-secondary";
  document.getElementById("obj-mode-image").className  = mode === "image"  ? "btn-primary" : "btn-secondary";
}

function login(){
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !password){ setLoginStatus("E-mail and password are required.", true); return; }
  setLoginStatus("Logging in…");
  sketchup.login(email, password);
}

function logout(){ sketchup.logout(); }
function refreshCredits(){ sketchup.refresh_credits(); }

function startRender(){
  const useViewport = document.getElementById("use-viewport").checked;
  const cat         = document.getElementById("style-category").value;
  const rt          = document.getElementById("render-type").value;
  const params = {
    prompt:       document.getElementById("prompt").value,
    style:        document.getElementById("style-select").value,
    use_viewport: useViewport,
    image_path:   useViewport ? "" : document.getElementById("image-path").value,
    render_type:  cat === "architectural" ? rt : null,
    day_time:     (cat === "architectural" && rt !== "site") ? document.getElementById("day-time").value : null,
    weather:      (cat === "architectural" && rt === "exterior") ? document.getElementById("weather").value : null,
  };
  showRenderStatus(true, "Submitting…", 0);
  document.getElementById("render-btn").disabled = true;
  sketchup.start_render(JSON.stringify(params));
}

function startObject(){
  const params = {
    prompt:     objMode === "prompt" ? document.getElementById("obj-prompt").value : "",
    image_path: objMode === "image"  ? document.getElementById("obj-image-path").value : "",
  };
  showObjStatus(true, "Submitting…", 0);
  document.getElementById("obj-btn").disabled = true;
  sketchup.start_object(JSON.stringify(params));
}

function showRenderStatus(visible, text, pct){
  const box = document.getElementById("render-status");
  box.style.display = visible ? "" : "none";
  document.getElementById("render-status-text").textContent = text;
  document.getElementById("render-progress-bar").style.width = pct + "%";
}

function showObjStatus(visible, text, pct){
  const box = document.getElementById("obj-status");
  box.style.display = visible ? "" : "none";
  document.getElementById("obj-status-text").textContent = text;
  document.getElementById("obj-progress-bar").style.width = pct + "%";
}

function setLoginStatus(msg, isError){
  const el = document.getElementById("login-status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
}

// Entry point called by Ruby
window.quviReceive = function(data){
  switch(data.event){
    case "logged_in":
      document.getElementById("login-view").style.display = "none";
      document.getElementById("main-view").style.display  = "";
      document.getElementById("credits-val").textContent  = data.credits >= 0 ? data.credits : "—";
      break;
    case "logged_out":
      document.getElementById("login-view").style.display = "";
      document.getElementById("main-view").style.display  = "none";
      break;
    case "credits_updated":
      document.getElementById("credits-val").textContent = data.credits >= 0 ? data.credits : "—";
      break;
    case "error":
      setLoginStatus(data.message, true);
      break;
    case "render_started":
      showRenderStatus(true, "Queued…", 0);
      break;
    case "render_done":
      showRenderStatus(false, "", 0);
      document.getElementById("render-btn").disabled = false;
      lastRenderPath = data.path;
      document.getElementById("credits-val").textContent = data.credits >= 0 ? data.credits : "—";
      alert("Render complete! Image opened in viewer.\n\nPath: " + data.path);
      break;
    case "render_error":
      showRenderStatus(false, "", 0);
      document.getElementById("render-btn").disabled = false;
      alert("Render error: " + data.message);
      break;
    case "object_started":
      showObjStatus(true, "Queued…", 0);
      break;
    case "object_done":
      showObjStatus(false, "", 0);
      document.getElementById("obj-btn").disabled = false;
      document.getElementById("credits-val").textContent = data.credits >= 0 ? data.credits : "—";
      alert("3D Object imported into scene!");
      break;
    case "object_error":
      showObjStatus(false, "", 0);
      document.getElementById("obj-btn").disabled = false;
      alert("Object generation error: " + data.message);
      break;
    case "status_update":
      const pct = data.progress || 0;
      const txt = data.eta ? `${data.status} — ${data.eta}` : data.status;
      // Update whichever operation is running
      showRenderStatus(document.getElementById("render-status").style.display !== "none", txt, pct);
      showObjStatus(document.getElementById("obj-status").style.display !== "none", txt, pct);
      break;
  }
};

// Init
onCategoryChange();
onRenderTypeChange();
sketchup.init();
</script>
</body>
</html>
